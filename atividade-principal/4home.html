<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Adivinhação - Atividade 4</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="4style.css">
</head>

<body>
    <header class="barra-superior">
        <a href="1home.html">
            <img src="imagens/logo urubu.png" alt="Logo Urubu" class="logo">
        </a>
        <a href="1home.html" class="titulo">RAFAELmagalhães_barreto</a>
    </header>

    <main>
        <div class="game-container">
            <h1>Jogo da Adivinhação</h1>
            <p class="game-subtitle">Tente adivinhar o número entre 1 e 100!</p>
            <div class="divider"></div>
            <div class="input-group">
                <input type="number" id="input" placeholder="Digite um número de 1 a 100" min="1" max="100">
            </div>
            <button id="btn-verificar">Verificar</button>
            <button id="btn-novo" class="btn-novo" style="display: none;">Novo Jogo</button>
            <div class="divider"></div>
            <p id="resultado" class="resultado"></p>
            <p id="tentativas" class="tentativas"></p>
        </div>
    </main>

    <script src="4script.js"></script>
</body>

</html>
