<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário - Atividade 8</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="8style.css">
</head>

<body>
    <header class="barra-superior">
        <a href="1home.html">
            <img src="imagens/logo urubu.png" alt="Logo Urubu" class="logo">
        </a>
        <a href="1home.html" class="titulo">RAFAELmagalhães_barreto</a>
    </header>

    <main>
        <div class="form-container">
            <h1>Servidor</h1>

            <div class="form-section">
                <h2>Formulário (método: GET, action: /inicio)</h2>
                <form action="/inicio" method="get" class="form">
                    <div class="form-field">
                        <label for="nome-get">Nome:</label>
                        <input type="text" id="nome-get" name="info" required>
                    </div>
                    <button type="submit">Enviar</button>
                </form>
            </div>

            <div class="form-section">
                <h2>Formulário (método: POST, action: /inicio)</h2>
                <form action="/inicio" method="post" class="form">
                    <div class="form-field">
                        <label for="data-post">Data:</label>
                        <input type="date" id="data-post" name="data" required>
                    </div>
                    <button type="submit">Enviar</button>
                </form>
            </div>

            <div class="form-section">
                <h2>Cadastrar Usuário</h2>
                <form action="/cadastro" method="get" class="form" id="form-cadastro">
                    <div class="form-field">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>
                    <div class="form-field">
                        <label for="sobrenome">Sobrenome:</label>
                        <input type="text" id="sobrenome" name="sobrenome" required>
                    </div>
                    <div class="form-field">
                        <label for="nascimento">Nascimento:</label>
                        <input type="date" id="nascimento" name="nascimento" required>
                    </div>
                    <div class="form-field">
                        <label for="civil">Estado civil:</label>
                        <input type="text" id="civil" name="civil" required>
                    </div>
                    <button type="submit">Salvar</button>
                </form>
            </div>
        </div>
    </main>

    <script src="8script.js"></script>
</body>

</html>
